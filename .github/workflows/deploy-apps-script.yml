name: Deploy Apps Script backend

# Pushes apps-script/Code.gs to the Apps Script project and publishes a new
# version of the existing web-app deployment (same /exec URL) whenever the
# backend changes on main. Does nothing until the three secrets below are set,
# so it won't fail on unrelated changes.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   CLASPRC_JSON                – full contents of your ~/.clasprc.json (from `clasp login`)
#   APPS_SCRIPT_ID              – the Apps Script "Script ID" (Project Settings)
#   APPS_SCRIPT_DEPLOYMENT_ID   – the web-app deployment ID (from `clasp deployments`)
# apps-script/appsscript.json must also be committed (generated by `clasp clone`).

on:
  push:
    branches: [main]
    paths:
      - 'apps-script/**'
      - '.github/workflows/deploy-apps-script.yml'
  workflow_dispatch:

concurrency:
  group: apps-script-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        id: cfg
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$APPS_SCRIPT_ID" ] || [ -z "$APPS_SCRIPT_DEPLOYMENT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Apps Script auto-deploy is not configured yet (missing secrets) — skipping. See apps-script/README.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.configured == 'true'
        with:
          node-version: '20'

      - name: Install clasp
        if: steps.cfg.outputs.configured == 'true'
        run: npm install -g @google/clasp@2.4.2

      - name: Write clasp credentials + project config
        if: steps.cfg.outputs.configured == 'true'
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"."}' "$APPS_SCRIPT_ID" > apps-script/.clasp.json

      - name: Push code to Apps Script
        if: steps.cfg.outputs.configured == 'true'
        working-directory: apps-script
        run: clasp push --force

      - name: Publish new web-app version (same /exec URL)
        if: steps.cfg.outputs.configured == 'true'
        working-directory: apps-script
        run: clasp deploy --deploymentId "${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}" --description "auto ${{ github.sha }}"
